services:
  db:
    image: postgres:16-alpine
    container_name: pbs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plasticbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plasticbox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./code/backend
    container_name: pbs_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/plasticbox_db"
      SECRET_KEY: "backend_secret_key"
    volumes:
      - ./code/backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./code/frontend
    container_name: pbs_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: "http://backend:8000"
    volumes:
      - ./code/frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:

    